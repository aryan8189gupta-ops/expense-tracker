<!DOCTYPE html>
<html>
<head>
    <title>jQuery Animation</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        #box {
            width: 100px;
            height: 100px;
            background-color: red;
            color: white;
            padding: 10px;
        }
    </style>

    <script>
        $(document).ready(function() {
            $("#btn").click(function() {

                $("#box").animate({
                    width: "200px",
                    height: "150px",
                    padding: "30px",
                    marginLeft: "100px",
                    opacity: 0.5
                }, 1000);

            });
        });
    </script>
</head>

<body>

    <div id="box">Hello</div>
    <br>

    <button id="btn">Animate</button>

</body>
</html>
